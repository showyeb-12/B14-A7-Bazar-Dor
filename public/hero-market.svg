<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" fill="none" role="img" aria-label="কাঁচাবাজারের ঝুড়ি">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcfce7"/>
      <stop offset="1" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <rect x="20" y="20" width="600" height="440" rx="36" fill="url(#bg)"/>
  <circle cx="320" cy="250" r="150" fill="#ffffff" opacity="0.6"/>
  <circle cx="500" cy="110" r="58" fill="#fde68a" opacity="0.8"/>
  <circle cx="150" cy="372" r="72" fill="#a7f3d0" opacity="0.8"/>

  <g font-family="'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif" text-anchor="middle">
    <text x="320" y="292" font-size="150">🧺</text>
    <text x="140" y="150" font-size="64">🍚</text>
    <text x="500" y="150" font-size="64">🐟</text>
    <text x="120" y="300" font-size="60">🥬</text>
    <text x="524" y="300" font-size="60">🍗</text>
    <text x="180" y="410" font-size="52">🥚</text>
    <text x="470" y="416" font-size="52">🌶️</text>
    <text x="320" y="90" font-size="54">🛒</text>
  </g>

  <g transform="translate(30 30)">
    <rect width="150" height="54" rx="16" fill="url(#band)"/>
    <text x="16" y="35" font-size="24" fill="#ffffff"
      font-family="'Segoe UI Emoji','Noto Color Emoji',sans-serif">আজকের দাম 🔴</text>
  </g>
</svg>
